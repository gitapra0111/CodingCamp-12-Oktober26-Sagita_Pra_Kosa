<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Apply saved theme before render to avoid flash -->
  <script>
    (function () {
      // Value is stored via JSON.stringify, so parse it before comparing
      try {
        const saved = JSON.parse(localStorage.getItem('dashboardTheme'));
        if (saved === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <span class="header-title">My Dashboard</span>
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle light/dark mode" title="Toggle theme">
      <!-- Sun icon (shown in dark mode) -->
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- Moon icon (shown in light mode) -->
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="dashboard-grid">

    <!-- ===== SECTION 1: GREETING ===== -->
    <section class="card greeting-card" aria-label="Greeting">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date-display" class="date-display">Loading…</div>
      <div class="greeting-row">
        <h1 id="greeting-text" class="greeting-text">Good Morning, Friend!</h1>
        <button id="edit-name-btn" class="icon-btn" aria-label="Edit name" title="Edit your name">
          <!-- Pencil icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
      </div>
      <!-- Inline name-edit form (hidden by default) -->
      <div id="name-edit-form" class="name-edit-form hidden">
        <input id="name-input" type="text" maxlength="40" placeholder="Enter your name…" class="inline-input" />
        <button id="name-confirm-btn" class="btn btn-sm">Save</button>
        <button id="name-cancel-btn" class="btn btn-sm btn-ghost">Cancel</button>
      </div>
    </section>

    <!-- ===== SECTION 2: FOCUS TIMER ===== -->
    <section class="card timer-card" aria-label="Focus Timer">
      <h2 class="card-title">Focus Timer</h2>

      <!-- Custom duration input -->
      <div class="timer-duration-row">
        <label for="pomodoro-minutes" class="label-sm">Duration (minutes):</label>
        <input id="pomodoro-minutes" type="number" min="1" max="60" value="25" class="inline-input input-sm" />
      </div>

      <!-- Timer display -->
      <div id="timer-display" class="timer-display">25:00</div>

      <!-- Timer controls -->
      <div class="timer-controls">
        <button id="timer-start" class="btn">Start</button>
        <button id="timer-pause" class="btn btn-outline" disabled>Pause</button>
        <button id="timer-reset" class="btn btn-outline">Reset</button>
      </div>
    </section>

    <!-- ===== SECTION 3: TO-DO LIST ===== -->
    <section class="card todo-card" aria-label="To-Do List">
      <h2 class="card-title">To-Do List</h2>

      <!-- Add task input -->
      <div class="todo-add-row">
        <input id="todo-input" type="text" maxlength="200" placeholder="Add a new task…" class="inline-input flex-1" />
        <button id="todo-add-btn" class="btn">Add</button>
      </div>
      <!-- Duplicate warning -->
      <p id="todo-warning" class="warning-text hidden">Task already exists!</p>

      <!-- Task list -->
      <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
    </section>

    <!-- ===== SECTION 4: QUICK LINKS ===== -->
    <section class="card links-card" aria-label="Quick Links">
      <h2 class="card-title">Quick Links</h2>

      <!-- Add link form -->
      <div class="links-add-row">
        <input id="link-name-input" type="text" maxlength="40" placeholder="Name" class="inline-input" />
        <input id="link-url-input" type="url" maxlength="500" placeholder="https://…" class="inline-input flex-1" />
        <button id="link-add-btn" class="btn">Add Link</button>
      </div>

      <!-- Links grid -->
      <div id="links-grid" class="links-grid" aria-label="Quick links grid"></div>
    </section>

  </main>

  <!-- Main Script -->
  <script src="js/script.js"></script>
</body>
</html>
